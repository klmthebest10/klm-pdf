name: Rilis exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rilis
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - name: Ganti nama installer
        shell: bash
        run: cp dist/KLM-PDF-Setup-*.exe KLM-PDF-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: KLM-PDF-Setup.exe

  rilis:
    needs: [exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: KLM PDF v1.3.${{ github.run_number }}
          make_latest: true
          body: |
            **Windows:** unduh `KLM-PDF-Setup.exe` lalu pasang (bisa dijadikan aplikasi PDF default). Bila muncul SmartScreen: *Info selengkapnya → Tetap jalankan*.
          files: |
            KLM-PDF-Setup.exe
