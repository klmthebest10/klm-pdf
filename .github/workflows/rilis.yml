name: Rilis exe & apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rilis
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - name: Ganti nama installer
        shell: bash
        run: cp dist/KLM-PDF-Setup-*.exe KLM-PDF-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: KLM-PDF-Setup.exe

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bangun APK Android
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/web && cp -r web android/app/src/main/assets/web
          rm -f android/app/src/main/assets/web/sw.js
          cd android && gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../KLM-PDF.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: KLM-PDF.apk

  rilis:
    needs: [exe, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: KLM PDF v1.3.${{ github.run_number }}
          make_latest: true
          body: |
            **Windows:** unduh `KLM-PDF-Setup.exe` lalu pasang (bisa dijadikan aplikasi PDF default). Bila muncul SmartScreen: *Info selengkapnya → Tetap jalankan*.
            **Android:** unduh `KLM-PDF.apk`, buka di HP, izinkan *Pasang dari sumber tidak dikenal*, lalu pasang.
          files: |
            KLM-PDF-Setup.exe
            KLM-PDF.apk
